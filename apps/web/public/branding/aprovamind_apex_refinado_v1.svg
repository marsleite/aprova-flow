<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141118" />
      <stop offset="60%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#050506" />
    </radialGradient>

    <!-- Warm Amber-Gold Radiant Gradient for the "A" -->
    <linearGradient id="apexGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="45%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <!-- Diamond Needle Gradient with Center Highlight -->
    <linearGradient id="needleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Subtle Ambient Glow under the mark -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="url(#bgGlow)" />

  <!-- Ambient light pulse behind symbol -->
  <circle cx="500" cy="500" r="280" fill="#ea580c" opacity="0.07" filter="blur(60px)" />

  <g transform="translate(0, 10)">
    <!-- Main "A" legs (Clean architectural geometry) -->
    <!-- Left leg and Right leg path -->
    <!-- Apex at (500, 180), bottom left (180, 800), bottom right (820, 800) -->
    <!-- Left outer: 500,180 -> 180,800. Right outer: 500,180 -> 820,800 -->
    <!-- Leg width: ~110px -->
    <path
      d="
        M 500, 180
        L 820, 790
        L 695, 790
        L 575, 550
        L 425, 550
        L 305, 790
        L 180, 790
        Z
      "
      fill="url(#apexGrad)"
    />

    <!-- Inner negative space cutout triangle -->
    <!-- Re-cut the inner triangle to ensure pure geometry -->
    <polygon
      points="500, 345 425, 495 575, 495"
      fill="url(#bgGlow)"
    />

    <!-- The Refined Diamond Horizon Needle (Crossing with precision & golden ratio) -->
    <!-- Center at (500, 520), height 64px, width 760px tapering to razor points -->
    <path
      d="
        M 120, 520
        Q 320, 488, 500, 485
        Q 680, 488, 880, 520
        Q 680, 552, 500, 555
        Q 320, 552, 120, 520
        Z
      "
      fill="url(#needleGrad)"
      filter="drop-shadow(0px 8px 16px rgba(0,0,0,0.5))"
    />
  </g>
</svg>